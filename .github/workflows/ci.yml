# Kalite kapısı: tür denetimi + birim/entegrasyon testleri (sunucu + web) + web derlemesi.
# E2E (Playwright) ve Android derlemesi bilerek dışarıda: yavaş/ortam bağımlı; yerelde `npm run e2e` ile çalıştırılır.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kalite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Desteklenen en düşük sürüm (DatabaseSync.isTransaction 22.16.0'da geldi) ve güncel LTS.
        node: ["22.16", "24"]
    name: kalite (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Tür denetimi (shared, server, web)
        run: npm run typecheck
      - name: Testler (server + web)
        run: npm test
      - name: Web derlemesi
        run: npm run build
